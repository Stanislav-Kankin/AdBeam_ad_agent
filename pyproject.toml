[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adbeam-performance-analyst"
version = "0.1.0"
description = "Internal read-only Telegram performance analyst for AdBeam"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "APScheduler>=3.11,<4",
  "SQLAlchemy[asyncio]>=2.0.38,<3", "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "PyYAML>=6.0.2,<7",
  "openai>=1.68,<4", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
adbeam = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent" = ["*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
